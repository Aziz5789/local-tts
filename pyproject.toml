[project]
name = "vox"
version = "0.1.0"
description = "Local, engine-agnostic text-to-speech and voice-cloning toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.4.6",
    "numpy>=2.5.1",
    "soundfile>=0.14.0",
    "typer>=0.27.0",
]

[project.scripts]
vox = "vox.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
